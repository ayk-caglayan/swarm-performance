<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151e">
  <meta name="description" content="Join the local Nervengarten performance with sound and graphics controlled by SuperCollider.">
  <title>Nervengarten instrument</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/p5.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><h1>Nervengarten</h1><span id="device">Connecting…</span></header>
    <section id="stage" aria-label="Live circle controlled by the performer"></section>
    <section class="controls" aria-label="Your instrument">
      <p id="status" role="status">Connecting to the local gateway…</p>
      <div class="actions">
        <button id="enable" disabled>Enable sound</button>
        <button id="mute" aria-pressed="false">Mute</button>
      </div>
      <label for="volume">Your volume <output id="volume-value">50%</output></label>
      <input id="volume" type="range" min="0" max="100" value="50">
      <button id="wake" aria-pressed="false" aria-describedby="wake-status">Keep screen awake</button>
      <p id="wake-status" class="hint" role="status">Checking screen wake support…</p>
      <p class="hint">Keep this page visible during the performance.</p>
      <details><summary>Connection details</summary><p id="diagnostics">Waiting for the master.</p></details>
    </section>
    <noscript>This instrument needs JavaScript. Enable it and reload this page.</noscript>
  </main>
</body>
</html>
